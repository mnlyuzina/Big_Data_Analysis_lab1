version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres_lab
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./attachments:/attachments
    restart: unless-stopped